<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="./favicon.ico">
</head>

<body>
  <div class="container">
    <ul class="comments">
      <!-- Комментарии будут отрисовываться через JS -->
    </ul>
    <div class="add-form">
      <!-- Блок для отображения цитируемого комментария -->
      <div class="quote-block" style="display: none;">
        <div class="quote-header">
          Ответ на комментарий: <span class="quote-author"></span>
        </div>
        <div class="quote-text"></div>
      </div>
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const nameInput = document.querySelector(".add-form-name");
    const commentInput = document.querySelector(".add-form-text");
    const addButton = document.querySelector(".add-form-button");
    const commentsList = document.querySelector(".comments");
    const quoteBlock = document.querySelector(".quote-block");
    const quoteAuthor = document.querySelector(".quote-author");
    const quoteText = document.querySelector(".quote-text");

    let comments = [
      {
        id: 1,
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        text: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLiked: false,
      },
      {
        id: 2,
        name: "Варвара Н.",
        date: "13.02.22 19:22",
        text: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLiked: false,
      },
    ];

    let replyingTo = null; // ID комментария, на который отвечаем

    // Функция для экранирования HTML
    const escapeHtml = (text) => {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    };

    // Функция для отрисовки одного комментария
    const renderComment = (comment) => {
      // НЕ экранируем здесь, так как данные уже экранированы при сохранении
      return `
    <li class="comment" data-id="${comment.id}">
      <div class="comment-header">
        <div>${comment.name}</div> <!-- Убрали escapeHtml() -->
        <div>${comment.date}</div>
      </div>
      <div class="comment-body">
        <div class="comment-text">
          ${comment.text} <!-- Убрали escapeHtml() -->
        </div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <span class="likes-counter">${comment.likes}</span>
          <button class="like-button ${comment.isLiked ? "-active-like" : ""}" data-action="like"></button>
        </div>
      </div>
    </li>
  `;
    };

    // Функция для отрисовки всех комментариев
    const renderComments = () => {
      commentsList.innerHTML = comments.map(renderComment).join("");

      // Обработчики для лайков
      document.querySelectorAll(".like-button").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const commentElement = event.target.closest(".comment");
          const commentId = parseInt(commentElement.dataset.id);
          const comment = comments.find(c => c.id === commentId);

          if (comment.isLiked) {
            comment.likes--;
            comment.isLiked = false;
          } else {
            comment.likes++;
            comment.isLiked = true;
          }

          renderComments();
        });
      });

      document.querySelectorAll(".comment").forEach((commentElement) => {
        commentElement.addEventListener("click", (event) => {

          if (event.target.closest('[data-action="like"]')) {
            return;
          }

          const commentId = parseInt(commentElement.dataset.id);
          const comment = comments.find(c => c.id === commentId);

          replyingTo = commentId;


          quoteBlock.style.display = "block";


          quoteAuthor.textContent = comment.name;
          quoteText.textContent = comment.text;

          commentInput.value = `> ${comment.text}\n\n`;
          commentInput.focus();
        });
      });
    };

    addButton.addEventListener("click", () => {
      const name = nameInput.value.trim();
      const text = commentInput.value.trim();

      if (!name || !text) {
        alert("Пожалуйста, заполните все поля");
        return;
      }

      const newComment = {
        id: Date.now(),
        name: escapeHtml(name),
        date: new Date().toLocaleString(),
        text: escapeHtml(text),
        likes: 0,
        isLiked: false,
      };

      comments.push(newComment);
      renderComments();

      nameInput.value = "";
      commentInput.value = "";
      quoteBlock.style.display = "none";
      replyingTo = null;
    });

    comments = comments.map(comment => ({
      ...comment,
      name: escapeHtml(comment.name),
      text: escapeHtml(comment.text)
    }));

    renderComments();
  </script>
</body>

</html>
