<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="./favicon.ico">
</head>

<body>
  <div class="container">
    <ul class="comments">
      <!-- Комментарии будут отрисовываться через JS -->
    </ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";

  const nameInput = document.querySelector(".add-form-name");
  const commentInput = document.querySelector(".add-form-text");
  const addButton = document.querySelector(".add-form-button");
  const commentsList = document.querySelector(".comments");

  // Исходные данные комментариев
  let comments = [
    {
      id: 1,
      name: "Глеб Фокин",
      date: "12.02.22 12:18",
      text: "Это будет первый комментарий на этой странице",
      likes: 3,
      isLiked: false,
    },
    {
      id: 2,
      name: "Варвара Н.",
      date: "13.02.22 19:22",
      text: "Мне нравится как оформлена эта страница! ❤",
      likes: 75,
      isLiked: false,
    },
  ];

  // Функция для отрисовки одного комментария
  const renderComment = (comment) => {
    return `
        <li class="comment" data-id="${comment.id}">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button class="like-button ${comment.isLiked ? "-active-like" : ""}"></button>
            </div>
          </div>
        </li>
      `;
  };

  // Функция для отрисовки всех комментариев
  const renderComments = () => {
    commentsList.innerHTML = comments.map(renderComment).join("");

    // Добавляем обработчики лайков
    document.querySelectorAll(".like-button").forEach((button) => {
      button.addEventListener("click", (event) => {
        const commentElement = event.target.closest(".comment");
        const commentId = parseInt(commentElement.dataset.id);
        const comment = comments.find(c => c.id === commentId);

        if (comment.isLiked) {
          comment.likes--;
          comment.isLiked = false;
        } else {
          comment.likes++;
          comment.isLiked = true;
        }

        renderComments(); // Перерисовываем комментарии
      });
    });
  };

  // Обработчик добавления нового комментария
  addButton.addEventListener("click", () => {
    const name = nameInput.value.trim();
    const text = commentInput.value.trim();

    if (!name || !text) {
      alert("Пожалуйста, заполните все поля");
      return;
    }

    const newComment = {
      id: Date.now(), // Простой способ получить уникальный id
      name: name,
      date: new Date().toLocaleString(),
      text: text,
      likes: 0,
      isLiked: false,
    };

    comments.push(newComment);
    renderComments();

    // Очищаем поля ввода
    nameInput.value = "";
    commentInput.value = "";
  });

  // Инициализация: отрисовка начальных комментариев
  renderComments();
</script>

</html>
